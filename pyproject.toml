[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ml_atmospheric_emission"
version = "1.1.0"
description = "Previsao da pluma visivel (camera) de 15 a 360 min e recomendacao de ajustes nas tags de processo"
authors = [
  { name = "jmetrimiranda" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "matplotlib",
    "joblib",
    "requests",
    "openpyxl",
]

[project.scripts]
pluma = "ml_atmospheric_emission.pipeline:main"


[tool.ruff]
line-length = 99
src = ["ml_atmospheric_emission"]
include = ["pyproject.toml", "ml_atmospheric_emission/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ml_atmospheric_emission"]
force-sort-within-sections = true

